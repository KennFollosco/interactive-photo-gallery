<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interactive Photo Gallery</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
    }

    #image {
        width: 600px;
        height: 400px;
        border: 3px solid black;
        margin: 20px auto;
        line-height: 400px;
        font-size: 20px;
        background-size: cover;
        background-position: center;
        color: white;
        font-weight: bold;
    }

    img {
        width: 150px;
        margin: 10px;
        border: 2px solid gray;
        cursor: pointer;
    }

    img:focus {
        border: 3px solid blue;
    }
</style>

<script>
function upDate(previewPic) {
    console.log("Mouse over / Focus triggered");
    document.getElementById("image").style.backgroundImage = "url('" + previewPic.src + "')";
    document.getElementById("image").innerHTML = previewPic.alt;
}

function unDo() {
    console.log("Mouse leave / Blur triggered");
    document.getElementById("image").style.backgroundImage = "url('')";
    document.getElementById("image").innerHTML = "Hover over or focus on an image below.";
}

function addTabFocus() {
    console.log("Page loaded - Adding tabindex attributes");

    let images = document.querySelectorAll("img");

    for (let i = 0; i < images.length; i++) {
        images[i].setAttribute("tabindex", "0");
    }
}

window.onload = addTabFocus;
</script>
</head>

<body>

<h1>Interactive Photo Gallery</h1>

<div id="image">
    Hover over or focus on an image below.
</div>

<!-- 6 Images with alt text -->

<img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
     alt="Beautiful mountain landscape at sunset"
     onmouseover="upDate(this)"
     onmouseleave="unDo()"
     onfocus="upDate(this)"
     onblur="unDo()">

<img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
     alt="Calm beach with turquoise water"
     onmouseover="upDate(this)"
     onmouseleave="unDo()"
     onfocus="upDate(this)"
     onblur="unDo()">

<img src="https://images.unsplash.com/photo-1493244040629-496f6d136cc3"
     alt="Forest pathway surrounded by trees"
     onmouseover="upDate(this)"
     onmouseleave="unDo()"
     onfocus="upDate(this)"
     onblur="unDo()">

<img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
     alt="Snowy mountain peaks under blue sky"
     onmouseover="upDate(this)"
     onmouseleave="unDo()"
     onfocus="upDate(this)"
     onblur="unDo()">

<img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
     alt="City skyline at night with bright lights"
     onmouseover="upDate(this)"
     onmouseleave="unDo()"
     onfocus="upDate(this)"
     onblur="unDo()">

<img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429"
     alt="Green rice fields during daytime"
     onmouseover="upDate(this)"
     onmouseleave="unDo()"
     onfocus="upDate(this)"
     onblur="unDo()">

</body>
</html>
